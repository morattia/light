
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Control Evento QR</title>

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 18px;
  background: #edf2f7;
  font-family: Arial, sans-serif;
  color: #17324d;
}

.panel {
  max-width: 460px;
  margin: 20px auto;
  padding: 23px;
  border-radius: 20px;
  background: white;
  box-shadow: 0 5px 22px #0002;
}

h1 {
  text-align: center;
  margin-bottom: 5px;
}

.subtitulo {
  color: #64748b;
  text-align: center;
  font-size: 14px;
}

label {
  display: block;
  margin-top: 18px;
  margin-bottom: 7px;
  font-weight: bold;
}

input, select, button {
  width: 100%;
  padding: 14px;
  font-size: 16px;
  border-radius: 10px;
  margin-bottom: 10px;
}

input, select {
  border: 1px solid #cbd5e1;
  background: white;
}

button {
  border: none;
  background: #174a78;
  color: white;
  font-weight: bold;
  cursor: pointer;
}

button:disabled {
  opacity: .5;
}

.secundario {
  background: #64748b;
}

#lector {
  width: 100%;
  margin-top: 15px;
}

#resultado {
  padding: 18px;
  border-radius: 12px;
  background: #e2e8f0;
  margin-top: 18px;
  text-align: center;
  font-weight: bold;
  white-space: pre-line;
  overflow-wrap: anywhere;
}

.exito {
  background: #d1fae5 !important;
  color: #065f46;
}

.error {
  background: #fee2e2 !important;
  color: #991b1b;
}

.aviso {
  background: #fef3c7 !important;
  color: #92400e;
}

.nota {
  color: #64748b;
  font-size: 12px;
  text-align: center;
}
</style>
</head>

<body>

<div class="panel">

<h1>CONTROL EVENTO QR</h1>

<p class="subtitulo">
Asistencia y entrega de refrigerios
</p>

<label for="REGI2026">Clave del encargado</label>

<input
  type="password"
  id="clave"
  placeholder="Ingresa tu clave"
  autocomplete="off"
>

<label for="operacion">Selecciona el registro</label>

<select id="operacion">
  <option value="asistencia">Asistencia</option>
  <option value="refri11">Refrigerio 11:00 a. m.</option>
  <option value="refri16">Refrigerio 4:00 p. m.</option>
</select>

<button id="iniciar" onclick="iniciarScanner()">
INICIAR ESCÁNER
</button>

<button class="secundario" onclick="detenerScanner()">
DETENER CÁMARA
</button>

<div id="lector"></div>

<div id="resultado">
Esperando para iniciar...
</div>

<p class="nota">
Cada participante puede registrar una vez cada operación.
</p>

</div>

<script>

// =====================================
// CONEXIÓN GOOGLE APPS SCRIPT
// =====================================

const API =
'https://script.google.com/macros/s/AKfycbxkD_MgnUuO3e5elILNIBYOeKw1eARJsGfWNfBd3Yfj8AHJo2MVmRZDNkKIEULircWbSw/exec';

let scanner = null;
let ocupado = false;
let ultimoCodigo = '';
let ultimoTiempo = 0;
let timeoutSolicitud = null;


// =====================================
// MOSTRAR MENSAJES
// =====================================

function mostrar(texto, tipo = '') {

  const caja = document.getElementById('resultado');

  caja.className = tipo;
  caja.textContent = texto;

}


// =====================================
// INICIAR CÁMARA
// =====================================

async function iniciarScanner() {

  if (scanner) return;

  const clave = document.getElementById('clave')
    .value.trim();

  if (!clave) {
    mostrar('Ingresa la clave del encargado.', 'error');
    return;
  }

  if (!window.isSecureContext ||
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia) {

    mostrar(
      'Necesitas abrir esta página mediante HTTPS y permitir el acceso a la cámara.',
      'error'
    );

    return;
  }

  try {

    mostrar('Solicitando acceso a la cámara...');

    scanner = new Html5Qrcode('lector');

    await scanner.start(
      { facingMode: 'environment' },
      {
        fps: 10,
        qrbox: { width: 230, height: 230 }
      },
      codigo => procesarQR(codigo),
      () => {}
    );

    document.getElementById('iniciar').disabled = true;

    mostrar(
      'CÁMARA ACTIVA\nEscanea un código QR.',
      'exito'
    );

  } catch(error) {

    scanner = null;

    mostrar(
      'ERROR DE CÁMARA: ' +
      (error.message || String(error)),
      'error'
    );

    console.error(error);

  }

}


// =====================================
// ENVIAR CÓDIGO A GOOGLE SHEETS
// =====================================

function procesarQR(codigo) {

  if (ocupado) return;

  const ahora = Date.now();

  if (
    codigo === ultimoCodigo &&
    ahora - ultimoTiempo < 3000
  ) {
    return;
  }

  ocupado = true;

  ultimoCodigo = codigo;
  ultimoTiempo = ahora;

  const clave = document.getElementById('clave')
    .value.trim();

  const operacion = document.getElementById('operacion')
    .value;

  mostrar(
    'Consultando participante...\nCódigo: ' + codigo
  );

  const parametros = new URLSearchParams({
    action: 'scan',
    code: codigo.trim(),
    operation: operacion,
    key: clave,
    callback: 'qrCallback'
  });

  const script = document.createElement('script');

  let terminado = false;

  function finalizar() {

    if (terminado) return;

    terminado = true;

    clearTimeout(timeoutSolicitud);

    if (script.parentNode) {
      script.parentNode.removeChild(script);
    }

    delete window.qrCallback;

    ocupado = false;

  }

  window.qrCallback = function(respuesta) {

    if (respuesta.ok) {

      mostrar(
        '✓ REGISTRO EXITOSO\n\n' +
        respuesta.nombre +
        '\nCódigo: ' + respuesta.codigo +
        '\nHora: ' + respuesta.hora,
        'exito'
      );

    } else {

      mostrar(
        '⚠ ' + respuesta.mensaje +
        (respuesta.nombre
          ? '\nParticipante: ' + respuesta.nombre
          : ''),
        'error'
      );

    }

    finalizar();

  };

  script.onerror = function() {

    mostrar(
      'ERROR DE CONEXIÓN\n\n' +
      'No se recibió respuesta de Google Apps Script.\n' +
      'Comprueba la implementación y la conexión a internet.',
      'error'
    );

    console.error('URL solicitada:', script.src);

    finalizar();

  };

  script.src = API + '?' + parametros.toString();

  document.body.appendChild(script);

  timeoutSolicitud = setTimeout(() => {

    if (!terminado) {

      mostrar(
        'TIEMPO AGOTADO\n\nGoogle no respondió a tiempo. Comprueba internet y vuelve a intentar.',
        'error'
      );

      finalizar();

    }

  }, 20000);

}


// =====================================
// DETENER CÁMARA
// =====================================

async function detenerScanner() {

  if (scanner) {

    try {

      await scanner.stop();
      await scanner.clear();

    } catch(error) {

      console.error(error);

    }

    scanner = null;

  }

  document.getElementById('iniciar').disabled = false;

  mostrar('Cámara detenida.', 'aviso');

}

</script>

</body>
</html>
