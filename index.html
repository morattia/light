
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Control Evento QR</title>

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

<style>
* { box-sizing: border-box; }

body {
  font-family: Arial, sans-serif;
  background: #edf2f7;
  margin: 0;
  padding: 18px;
  color: #18324b;
}

.panel {
  background: white;
  padding: 22px;
  border-radius: 18px;
  max-width: 460px;
  margin: auto;
  box-shadow: 0 4px 18px #0001;
}

h1 {
  text-align: center;
  margin-bottom: 5px;
}

.subtitulo {
  text-align: center;
  color: #64748b;
  font-size: 14px;
}

label {
  display: block;
  font-weight: bold;
  margin: 18px 0 7px;
}

input, select, button {
  width: 100%;
  padding: 14px;
  border-radius: 10px;
  font-size: 16px;
  margin-bottom: 10px;
}

input, select {
  border: 1px solid #cbd5e1;
  background: white;
}

button {
  border: none;
  background: #174a78;
  color: white;
  font-weight: bold;
  cursor: pointer;
}

button:disabled {
  opacity: .5;
}

.detener {
  background: #64748b;
}

#lector {
  width: 100%;
  margin-top: 15px;
}

#resultado {
  padding: 18px;
  margin-top: 18px;
  border-radius: 12px;
  background: #e2e8f0;
  text-align: center;
  font-weight: bold;
  overflow-wrap: anywhere;
}

.nota {
  font-size: 12px;
  text-align: center;
  color: #64748b;
}

</style>
</head>

<body>

<div class="panel">

<h1>CONTROL EVENTO QR</h1>

<p class="subtitulo">
Asistencia y entrega de refrigerios
</p>

<label for="clave">Clave del encargado</label>
<input
  type="password"
  id="clave"
  placeholder="Ingresa tu clave privada"
  autocomplete="off"
>

<label for="operacion">Tipo de registro</label>

<select id="operacion">
  <option value="asistencia">Asistencia</option>
  <option value="refri11">Refrigerio 11:00 a. m.</option>
  <option value="refri16">Refrigerio 4:00 p. m.</option>
</select>

<button id="iniciar" onclick="iniciarScanner()">
INICIAR CÁMARA
</button>

<button class="detener" onclick="detenerScanner()">
DETENER CÁMARA
</button>

<div id="lector"></div>

<div id="resultado">
Esperando para iniciar...
</div>

<p class="nota">
Cada persona puede registrar una sola vez cada operación.
</p>

</div>

<script>

const API =
'https://script.google.com/macros/s/AKfycbz1zPCZ_W64ZeEW191wSNSc2Bo7hMDiiqAnX4t9Y7L28MM731hZRflAPQhTrixZAs0kxg/exec';

let scanner = null;
let ocupado = false;
let ultimoCodigo = '';
let tiempoUltimo = 0;
let solicitudActual = null;

function mostrar(texto, tipo = 'normal') {

  const caja = document.getElementById('resultado');

  caja.textContent = texto;

  const colores = {
    normal: ['#e2e8f0', '#18324b'],
    exito: ['#d1fae5', '#065f46'],
    error: ['#fee2e2', '#991b1b'],
    aviso: ['#fef3c7', '#92400e']
  };

  caja.style.background = colores[tipo][0];
  caja.style.color = colores[tipo][1];
}


async function iniciarScanner() {

  if (scanner) return;

  const clave = document.getElementById('clave').value.trim();

  if (!clave) {
    mostrar('Ingresa la clave del encargado.', 'error');
    return;
  }

  if (!window.isSecureContext ||
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia) {

    mostrar('El navegador no permite acceder a la cámara. Abre la página HTTPS en Chrome o Safari.', 'error');
    return;
  }

  try {

    mostrar('Preparando cámara...');

    scanner = new Html5Qrcode('lector');

    await scanner.start(
      { facingMode: 'environment' },
      {
        fps: 10,
        qrbox: { width: 230, height: 230 }
      },
      codigo => procesarQR(codigo),
      () => {}
    );

    document.getElementById('iniciar').disabled = true;

    mostrar('¡CÁMARA ACTIVA! Escanea un participante.', 'exito');

  } catch(error) {

    scanner = null;

    mostrar(
      'No se pudo abrir la cámara: ' +
      (error.message || String(error)),
      'error'
    );

    console.error(error);

  }

}


function procesarQR(codigo) {

  const ahora = Date.now();

  if (ocupado) return;

  if (codigo === ultimoCodigo && ahora - tiempoUltimo < 2500) {
    return;
  }

  ocupado = true;
  ultimoCodigo = codigo;
  tiempoUltimo = ahora;

  const clave = document.getElementById('clave').value.trim();
  const operacion = document.getElementById('operacion').value;

  mostrar('Registrando código ' + codigo + '...');

  const parametros = new URLSearchParams({
    action: 'scan',
    code: codigo.trim(),
    operation: operacion,
    key: clave,
    callback: 'qrCallback'
  });

  const script = document.createElement('script');

  solicitudActual = script;

  window.qrCallback = function(respuesta) {

    if (respuesta.ok) {

      mostrar(
        '✓ ' + respuesta.mensaje +
        '\n' + respuesta.nombre +
        '\nCódigo: ' + respuesta.codigo +
        '\nHora: ' + respuesta.hora,
        'exito'
      );

    } else {

      mostrar(
        '⚠ ' + respuesta.mensaje +
        (respuesta.nombre ? '\n' + respuesta.nombre : ''),
        'error'
      );

    }

    finalizarSolicitud(script);

  };

  script.onerror = function() {

    mostrar(
      'No pudimos conectar con Google Sheets. Revisa internet y la implementación.',
      'error'
    );

    finalizarSolicitud(script);

  };

  script.src = API + '?' + parametros.toString();

  document.body.appendChild(script);

}


function finalizarSolicitud(script) {

  if (script && script.parentNode) {
    script.parentNode.removeChild(script);
  }

  solicitudActual = null;

  setTimeout(() => {
    ocupado = false;
  }, 1800);

}


async function detenerScanner() {

  if (scanner) {

    try {
      await scanner.stop();
      await scanner.clear();
    } catch(error) {
      console.error(error);
    }

    scanner = null;

  }

  document.getElementById('iniciar').disabled = false;

  mostrar('Cámara detenida.', 'aviso');

}

</script>

</body>
</html>
